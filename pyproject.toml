[project]
name = "scenestealer"
version = "0.1.0"
description = "SceneStealer — out-act the movies. Hack the North 2026."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "openai>=1.54",
    "elevenlabs>=1.13",
    "pymongo>=4.10",
    "pyyaml>=6.0",
    "typer>=0.13",
    # Grading: body pose + facial expression keypoints. Needed by prep (reference
    # extraction) and by the server (fallback extraction when the browser can't).
    # mediapipe already pulls opencv-contrib-python, which provides cv2 -- do NOT
    # also add opencv-python, or two packages fight over the same module.
    "mediapipe>=1.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
prep = [
    "truss>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
# The Python code lives under backend/; `assets/`, `scenes/` and `.env` stay at
# the repo root because the frontend shares them. One venv for the whole repo.
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Where first-party imports (`server`, `prep`, `scripts`) resolve from, so isort
# does not mistake them for third-party packages.
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends/File/Form in argument defaults is the framework's idiom.
"backend/server/main.py" = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/server", "backend/prep"]
